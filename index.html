<body>
  <div id="root"></div>
  <script>
    // Counterpart to public/404.html — decodes the real path back out of the
    // query string before React Router mounts, so deep links survive a refresh.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
